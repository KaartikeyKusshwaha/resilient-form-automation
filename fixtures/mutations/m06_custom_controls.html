<!doctype html><html><head><style>body{font:16px Arial}.radio{display:inline-block;padding:8px}input[type=radio]{opacity:0;width:1px;height:1px;position:absolute}</style></head><body><form><label>First Name <input type='text' data-test-target='first_name'></label><fieldset><legend>Gender</legend><label class='radio'><input type='radio' name='g' value='Male' data-test-target='gender_male'>Male</label><label class='radio'><input type='radio' name='g' value='Female'>Female</label></fieldset><div><span>State</span><button type='button' role='combobox' aria-label='State' aria-haspopup='listbox' data-test-target='state'>Select a state</button><ul role='listbox' style='display:none'><li role='option'>Gujarat</li><li role='option'>California</li></ul></div></form><script>const button=document.querySelector('[role=combobox]'),list=document.querySelector('[role=listbox]');button.addEventListener('click',()=>list.style.display='block');for(const option of list.children)option.addEventListener('click',()=>{button.textContent=option.textContent;list.style.display='none';option.setAttribute('aria-selected','true')});</script></body></html>
